name: Collect, Package and Upload
description: Copies dist/ into out/, archives it, and uploads as a workflow artifact.

inputs:
  lib_name:
    description: Library name used in the archive filename (e.g. libopus)
    required: true
  lib_version:
    description: Library version string (e.g. v1.5.2)
    required: true
  platform:
    description: Platform identifier (e.g. win64)
    required: true
  include_bin:
    description: Carry dist/bin through as bin/, for a release that ships a host tool as well as a library.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Collect (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        mkdir -p out/include out/lib
        cp -r dist/include/. out/include/
        find dist -name "*.a" -exec cp {} out/lib/ \;
        find dist \( -name "*.so" -o -name "*.so.*" -o -name "*.dylib" \) -exec cp {} out/lib/ \; 2>/dev/null || true
        if [ "${{ inputs.include_bin }}" = "true" ] && [ -d dist/bin ]; then
          mkdir -p out/bin
          cp -r dist/bin/. out/bin/
        fi

    - name: Collect (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force out\include, out\lib | Out-Null
        Copy-Item -Recurse dist\include\* out\include\
        Get-ChildItem dist -Recurse -Include *.lib,*.a,*.dll | Copy-Item -Destination out\lib\
        if ( '${{ inputs.include_bin }}' -eq 'true' -and ( Test-Path dist\bin ) ) {
          New-Item -ItemType Directory -Force out\bin | Out-Null
          Copy-Item -Recurse -Force dist\bin\* out\bin\
        }

    - name: Package (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: tar czf "${{ inputs.lib_name }}-${{ inputs.lib_version }}-${{ inputs.platform }}.tar.gz" -C out .

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path out\* -DestinationPath "${{ inputs.lib_name }}-${{ inputs.lib_version }}-${{ inputs.platform }}.zip"

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.lib_name }}-${{ inputs.platform }}
        path: ${{ inputs.lib_name }}-${{ inputs.lib_version }}-${{ inputs.platform }}.*
