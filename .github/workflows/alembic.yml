name: Build alembic

# Alembic, consumed by src/modeldoc_utils. sbox vendors 1.7.11; the default here is the
# last 1.7.x, which still links against IlmBase rather than Imath 3.x - see the note in
# openexr.yml for why staying on the IlmBase line matters.
#
# IlmBase is built inline as a private dependency rather than pulled from the openexr
# release, so this workflow stays independently runnable. Keep ilmbase_version in step
# with whatever openexr.yml last published.
#
# zlib is built from source on Windows only; Linux and macOS use the system one.

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'Alembic tag (e.g. 1.7.16)'
        required: true
        default: '1.7.16'
      ilmbase_version:
        description: 'OpenEXR/IlmBase tag to build against'
        required: true
        default: 'v2.5.8'
  push:
    tags: ['alembic-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
      ilmbase_version: ${{ steps.ver.outputs.ilmbase_version }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#alembic-}"
            I="v2.5.8"
          else
            V="${{ inputs.lib_version }}"
            I="${{ inputs.ilmbase_version }}"
          fi
          echo "lib_version=$V" >> $GITHUB_OUTPUT
          echo "ilmbase_version=$I" >> $GITHUB_OUTPUT
          echo "release_tag=alembic-$V" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   platform: win64 }
          - { os: ubuntu-24.04,     platform: linuxsteamrt64 }
          - { os: ubuntu-24.04-arm, platform: linuxsteamrtarm64 }
          - { os: macos-26,         platform: osxarm64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-msvc
        if: runner.os == 'Windows'

      - name: Install cmake + ninja + zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build zlib1g-dev

      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib zlib-src
          cmake -S zlib-src -B zlib-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\deps" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
          cmake --build zlib-build --parallel
          cmake --install zlib-build

      - name: Clone IlmBase ${{ needs.setup.outputs.ilmbase_version }}
        run: git clone --depth 1 --branch ${{ needs.setup.outputs.ilmbase_version }} https://github.com/AcademySoftwareFoundation/openexr openexr-src

      # -include cstdint for GCC 13+; see the same note in openexr.yml.
      - name: Build IlmBase (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S openexr-src -B openexr-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/deps" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_FLAGS="-include cstdint" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DOPENEXR_BUILD_UTILS=OFF \
            -DOPENEXR_VIEWERS_ENABLE=OFF \
            -DPYILMBASE_ENABLE=OFF
          cmake --build openexr-build --parallel
          cmake --install openexr-build

      - name: Build IlmBase (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S openexr-src -B openexr-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\deps" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE\deps" `
            -DZLIB_ROOT="$env:GITHUB_WORKSPACE\deps" `
            -DZLIB_USE_STATIC_LIBS=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DBUILD_TESTING=OFF `
            -DOPENEXR_BUILD_UTILS=OFF `
            -DOPENEXR_VIEWERS_ENABLE=OFF `
            -DPYILMBASE_ENABLE=OFF
          cmake --build openexr-build --parallel
          cmake --install openexr-build

      - name: Clone Alembic ${{ needs.setup.outputs.lib_version }}
        run: git clone --depth 1 --branch ${{ needs.setup.outputs.lib_version }} https://github.com/alembic/alembic src

      # Alembic 1.7.x does cmake_policy(SET CMP0042 OLD) under APPLE, which CMake 4.x
      # refuses outright - and CMAKE_POLICY_VERSION_MINIMUM cannot override an explicit
      # OLD. The policy only governs MACOSX_RPATH, which is irrelevant here because we
      # build static, so rewriting it to NEW cannot change our output.
      - name: Patch CMP0042 out (Unix)
        if: runner.os != 'Windows'
        run: sed -i.bak 's/CMP0042 OLD/CMP0042 NEW/' src/CMakeLists.txt

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_FLAGS="-include cstdint" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deps" \
            -DILMBASE_ROOT="$GITHUB_WORKSPACE/deps" \
            -DALEMBIC_SHARED_LIBS=OFF \
            -DALEMBIC_ILMBASE_LINK_STATIC=ON \
            -DUSE_HDF5=OFF \
            -DUSE_TESTS=OFF \
            -DUSE_BINARIES=OFF \
            -DUSE_EXAMPLES=OFF \
            -DALEMBIC_BUILD_LIBS=ON
          cmake --build src/build --parallel
          cmake --install src/build

      # CMAKE_MSVC_RUNTIME_LIBRARY does not reach this project even with CMP0091 set: CMake
      # reports the variable as used, and the objects still come out /MD. So spell the CRT
      # into the release flags, which is what CMP0091=OLD would have done anyway. The rest
      # of the string is CMake's own default for MSVC Release.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S src -B src\build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\dist" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            "-DCMAKE_CXX_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG" `
            "-DCMAKE_C_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG" `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE\deps" `
            -DILMBASE_ROOT="$env:GITHUB_WORKSPACE\deps" `
            -DALEMBIC_SHARED_LIBS=OFF `
            -DALEMBIC_ILMBASE_LINK_STATIC=ON `
            -DUSE_HDF5=OFF `
            -DUSE_TESTS=OFF `
            -DUSE_BINARIES=OFF `
            -DUSE_EXAMPLES=OFF `
            -DALEMBIC_BUILD_LIBS=ON
          cmake --build src\build --parallel
          cmake --install src\build
          # Fail here rather than at link time in sbox, which is where this last went wrong.
          $crt = dumpbin /nologo /DIRECTIVES ( Get-ChildItem dist -Recurse -Filter Alembic.lib | Select-Object -First 1 ).FullName |
            Select-String -Pattern "DEFAULTLIB:MSVCRT"
          if ( $crt ) { throw "Alembic.lib is still linked against the dynamic CRT" }

      - uses: ./.github/actions/collect-package-upload
        with:
          lib_name: alembic
          lib_version: ${{ needs.setup.outputs.lib_version }}
          platform: ${{ matrix.platform }}

  release:
    needs: [setup, build]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "alembic ${{ needs.setup.outputs.lib_version }}"
