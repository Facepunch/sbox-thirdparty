name: Release (reusable)

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      display_name:
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Idempotent: re-running a version that already has a release replaces its assets.
      # Create first and fall back only on "already exists", rather than asking whether the
      # release exists: a lookup that fails for any other reason, as it does when the API is
      # degraded, would send us to create and die there.
      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if out=$(gh release create "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.display_name }}" \
            --notes "" \
            artifacts/** 2>&1)
          then
            echo "$out"
          else
            echo "$out"
            case "$out" in
              *"already exists"*)
                echo "Release exists, replacing its assets"
                gh release upload "${{ inputs.release_tag }}" \
                  --repo "${{ github.repository }}" \
                  --clobber \
                  artifacts/**
                ;;
              *)
                exit 1
                ;;
            esac
          fi
