name: Build libcurl

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'libcurl version with dots (e.g. 8.12.1)'
        required: true
        default: '8.12.1'
      openssl_version:
        description: 'OpenSSL release to build the Linux TLS backend against'
        required: true
        default: '3.5.8'
  push:
    tags: ['libcurl-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      curl_tag: ${{ steps.ver.outputs.curl_tag }}
      openssl_version: ${{ steps.ver.outputs.openssl_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#libcurl-}"
          else
            V="${{ inputs.lib_version }}"
          fi
          # curl git tags use underscores: curl-8_12_1
          CURL_TAG="curl-$(echo "$V" | tr '.' '_')"
          echo "lib_version=$V"       >> $GITHUB_OUTPUT
          echo "curl_tag=$CURL_TAG"   >> $GITHUB_OUTPUT
          echo "release_tag=libcurl-$V" >> $GITHUB_OUTPUT
          # A tag push carries no inputs, so fall back to the same default declared above.
          echo "openssl_version=${{ inputs.openssl_version || '3.5.8' }}" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   platform: win64 }
          - { os: ubuntu-24.04,     platform: linuxsteamrt64, container: 'registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk:4.0.20260805.254769' }
          - { os: ubuntu-24.04-arm, platform: linuxsteamrtarm64 }
          - { os: macos-26,         platform: osxarm64 }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: ${{ matrix.platform }}

    steps:
      # Match sbox's Steam Runtime 4 SDK so libraries target the same system ABI.
      # Install the tools required by checkout and the dependency steps below.
      - name: Prepare Steam Runtime container
        if: matrix.container != ''
        shell: bash
        run: |
          apt-get -o APT::Update::Error-Mode=any update -qq
          apt-get install -y --no-install-recommends sudo git-lfs ca-certificates

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-msvc
        if: runner.os == 'Windows'

      - name: Install cmake + ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      # Build and ship OpenSSL as static archives so libengine2.so has no dependency on
      # the runtime or host distro's libssl version.
      - name: Build OpenSSL ${{ needs.setup.outputs.openssl_version }} (Linux)
        if: runner.os == 'Linux'
        run: |
          V="${{ needs.setup.outputs.openssl_version }}"
          curl -fsSL --retry 3 -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-$V/openssl-$V.tar.gz"
          mkdir -p ossl && tar xzf openssl.tar.gz -C ossl --strip-components=1
          cd ossl
          # -fPIC because these archives end up inside a shared library. Deprecated APIs stay
          # enabled: curl's NTLM code calls DES_ecb_encrypt and MD4_Init, which OpenSSL 3 keeps
          # only under those. install_sw skips the man pages, which are most of install's time.
          ./config no-shared no-tests no-docs \
            --prefix="$GITHUB_WORKSPACE/ossl-dist" --libdir=lib -fPIC
          make -j"$(nproc)"
          make install_sw

      - name: Install cmake + ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Clone libcurl ${{ needs.setup.outputs.lib_version }}
        run: git clone --depth 1 --branch ${{ needs.setup.outputs.curl_tag }} https://github.com/curl/curl.git src

      # ── Linux ──────────────────────────────────────────────────────────────
      # BROTLI and ZSTD are off explicitly rather than by omission: the Steam Runtime image
      # carries their headers, so cmake would otherwise detect them and leave libcurl.a needing
      # libraries this package does not ship. CURL_ZLIB already rules out content decoding, so
      # these belong with it.
      # Runtime 4 also carries libssh2 headers. Disable SSH explicitly so the static
      # archive does not acquire an unshipped libssh2 dependency through auto-detection.
      # FindOpenSSL reads pkg-config metadata as well as OPENSSL_ROOT_DIR. Point both
      # at our build so system OpenSSL's zlib dependency does not leak into curl.
      # Static libcurl with the OpenSSL backend, linked against the OpenSSL built above and
      # shipped beside it. engine2.build.cs takes libssl and libcrypto out of
      # src/thirdparty/libcurl/lib/<plat>/ to match.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/ossl-dist/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCURL_STATICLIB=ON \
            -DCURL_USE_OPENSSL=ON \
            -DCURL_USE_LIBSSH2=OFF \
            -DOPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/ossl-dist" \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_DISABLE_SMTP=ON \
            -DCURL_DISABLE_IMAP=ON \
            -DCURL_DISABLE_POP3=ON \
            -DCURL_DISABLE_FTP=ON \
            -DCURL_DISABLE_TELNET=ON \
            -DCURL_DISABLE_RTSP=ON \
            -DCURL_DISABLE_DICT=ON \
            -DCURL_DISABLE_GOPHER=ON \
            -DCURL_DISABLE_MQTT=ON \
            -DCURL_DISABLE_FILE=ON \
            -DCURL_ZLIB=OFF \
            -DCURL_BROTLI=OFF \
            -DCURL_ZSTD=OFF \
            -DUSE_NGHTTP2=OFF \
            -DUSE_NGTCP2=OFF \
            -DCURL_USE_LIBPSL=OFF \
            -DUSE_LIBIDN2=OFF
          cmake --build src/build --parallel
          cmake --install src/build
          # Ship OpenSSL alongside curl - collect-package-upload sweeps dist for *.a, so
          # landing them here is all it takes. Headers stay out; nothing includes <openssl/*>.
          cp "$GITHUB_WORKSPACE/ossl-dist/lib/libssl.a" \
             "$GITHUB_WORKSPACE/ossl-dist/lib/libcrypto.a" \
             "$GITHUB_WORKSPACE/dist/lib/"

      - name: Verify static curl linkage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Link against only the libraries we ship, then exercise curl initialization.
          # Building an archive alone does not catch missing transitive dependencies.
          printf '%s\n' '#include <curl/curl.h>' \
            'int main(void) { if (curl_global_init(CURL_GLOBAL_DEFAULT)) return 1; CURL *c = curl_easy_init(); if (!c) return 2; curl_easy_cleanup(c); curl_global_cleanup(); return 0; }' \
            | cc -I "$GITHUB_WORKSPACE/dist/include" -x c - -x none \
              "$GITHUB_WORKSPACE/dist/lib/libcurl.a" \
              "$GITHUB_WORKSPACE/dist/lib/libssl.a" \
              "$GITHUB_WORKSPACE/dist/lib/libcrypto.a" \
              -ldl -pthread -o "$RUNNER_TEMP/curl-link-check"
          "$RUNNER_TEMP/curl-link-check"

      # ── Windows ────────────────────────────────────────────────────────────
      # Build static libcurl backed by Windows Schannel - no extra DLLs needed.
      # Consumers must also link Crypt32.lib (handled in the sbox VPC).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S src -B src\build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\dist" `
            -DBUILD_SHARED_LIBS=OFF `
            -DBUILD_TESTING=OFF `
            -DCURL_STATICLIB=ON `
            -DCURL_USE_SCHANNEL=ON `
            -DCURL_USE_LIBPSL=OFF `
            -DUSE_LIBIDN2=OFF `
            -DCURL_DISABLE_LDAP=ON `
            -DCURL_DISABLE_SMTP=ON `
            -DCURL_DISABLE_IMAP=ON `
            -DCURL_DISABLE_POP3=ON `
            -DCURL_DISABLE_FTP=ON `
            -DCURL_DISABLE_TELNET=ON `
            -DCURL_DISABLE_RTSP=ON `
            -DCURL_DISABLE_DICT=ON `
            -DCURL_DISABLE_GOPHER=ON `
            -DCURL_DISABLE_MQTT=ON `
            -DCURL_DISABLE_FILE=ON `
            -DCURL_ZLIB=OFF `
            -DUSE_NGHTTP2=OFF `
            -DUSE_NGTCP2=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build src\build --parallel
          cmake --install src\build

          # cmake installs the lib as libcurl.lib or libcurl_a.lib; rename to curl.lib
          $lib = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\dist\lib" -Recurse -Include "*.lib" | Select-Object -First 1
          if ($lib -and $lib.Name -ne "curl.lib") {
            Write-Host "Renaming $($lib.Name) -> curl.lib"
            Rename-Item $lib.FullName "curl.lib"
          }

      # ── macOS ─────────────────────────────────────────────────────────────
      # Static libcurl on Secure Transport, the TLS that ships with macOS, so nothing to bundle.
      # Consumers link the Security framework (Osx.cs does). The option is CURL_USE_SECTRANSP;
      # spelled any other way cmake ignores it and falls back to OpenSSL, which the runner has
      # from homebrew - that is how the previous package came to need libssl.a it never shipped.
      # libssh2, brotli and zstd are off by name for the same reason.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCURL_STATICLIB=ON \
            -DCURL_USE_SECTRANSP=ON \
            -DCURL_USE_OPENSSL=OFF \
            -DCURL_USE_LIBSSH2=OFF \
            -DCURL_BROTLI=OFF \
            -DCURL_ZSTD=OFF \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_DISABLE_SMTP=ON \
            -DCURL_DISABLE_IMAP=ON \
            -DCURL_DISABLE_POP3=ON \
            -DCURL_DISABLE_FTP=ON \
            -DCURL_DISABLE_TELNET=ON \
            -DCURL_DISABLE_RTSP=ON \
            -DCURL_DISABLE_DICT=ON \
            -DCURL_DISABLE_GOPHER=ON \
            -DCURL_DISABLE_MQTT=ON \
            -DCURL_DISABLE_FILE=ON \
            -DCURL_ZLIB=OFF \
            -DUSE_NGHTTP2=OFF \
            -DUSE_NGTCP2=OFF \
            -DCURL_USE_LIBPSL=OFF \
            -DUSE_LIBIDN2=OFF
          cmake --build src/build --parallel
          cmake --install src/build

      - uses: ./.github/actions/collect-package-upload
        with:
          lib_name: libcurl
          lib_version: ${{ needs.setup.outputs.lib_version }}
          platform: ${{ matrix.platform }}

  release:
    needs: [setup, build]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "libcurl ${{ needs.setup.outputs.lib_version }}"
