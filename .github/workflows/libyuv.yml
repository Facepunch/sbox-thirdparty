name: Build libyuv

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'libyuv commit hash or branch (e.g. main)'
        required: true
        default: 'main'
  push:
    tags: ['libyuv-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#libyuv-}"
          else
            V="${{ inputs.lib_version }}"
          fi
          echo "lib_version=$V" >> $GITHUB_OUTPUT
          echo "release_tag=libyuv-$V" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   platform: win64 }
          - { os: ubuntu-24.04,     platform: linuxsteamrt64, container: 'registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20260805.254768' }
          - { os: ubuntu-24.04-arm, platform: linuxsteamrtarm64 }
          - { os: macos-26,         platform: osxarm64 }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: ${{ matrix.platform }}

    steps:
      # linuxsteamrt64 builds run inside the Steam Runtime 3 (sniper) SDK so their output only
      # needs symbols the runtime actually has. Building on ubuntu-latest instead is what left
      # these libraries needing GLIBC_2.38 when sniper provides 2.31. The image carries neither
      # sudo nor git-lfs, which actions/checkout and the dep steps below expect.
      - name: Prepare Steam Runtime container
        if: matrix.container != ''
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo git-lfs ca-certificates

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-msvc
        if: runner.os == 'Windows'

      - name: Install cmake + ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # clone + checkout rather than --branch, so a commit SHA works as well as a branch.
      - name: Clone libyuv ${{ needs.setup.outputs.lib_version }}
        run: |
          git clone https://chromium.googlesource.com/libyuv/libyuv src
          git -C src checkout ${{ needs.setup.outputs.lib_version }}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DUNIT_TEST=OFF
          cmake --build src/build --target yuv --parallel
          mkdir -p dist/include dist/lib
          cp -r src/include/. dist/include/
          cp src/build/libyuv.a dist/lib/

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S src -B src\build -G Ninja `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DUNIT_TEST=OFF
          cmake --build src\build --target yuv --parallel
          New-Item -ItemType Directory -Force dist\include, dist\lib | Out-Null
          Copy-Item -Recurse src\include\* dist\include\
          Copy-Item src\build\yuv.lib dist\lib\

      - uses: ./.github/actions/collect-package-upload
        with:
          lib_name: libyuv
          lib_version: ${{ needs.setup.outputs.lib_version }}
          platform: ${{ matrix.platform }}

  release:
    needs: [setup, build]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "libyuv ${{ needs.setup.outputs.lib_version }}"
