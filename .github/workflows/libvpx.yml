name: Build libvpx

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'libvpx tag (e.g. v1.16.0)'
        required: true
        default: 'v1.16.0'
  push:
    tags: ['libvpx-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#libvpx-}"
          else
            V="${{ inputs.lib_version }}"
          fi
          echo "lib_version=$V" >> $GITHUB_OUTPUT
          echo "release_tag=libvpx-$V" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   platform: win64 }
          - { os: ubuntu-24.04,     platform: linuxsteamrt64 }
          - { os: ubuntu-24.04-arm, platform: linuxsteamrtarm64 }
          - { os: macos-26,         platform: osxarm64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Windows: set up MSYS2 FIRST (before MSVC) so paccache runs before the
      # MSVC environment variables inflate the process environment beyond what
      # xargs can handle. path-type: inherit is evaluated per shell invocation,
      # so later steps that run after setup-msvc will still see cl.exe.
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MSYS
          install: make perl diffutils nasm
          path-type: inherit

      # Windows: set up MSVC environment (written to GITHUB_ENV / GITHUB_PATH,
      # picked up by all subsequent steps including MSYS2 shell invocations).
      - uses: ./.github/actions/setup-msvc
        if: runner.os == 'Windows'

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y make nasm

      - name: Clone libvpx ${{ needs.setup.outputs.lib_version }}
        run: git clone --depth 1 --branch ${{ needs.setup.outputs.lib_version }} https://github.com/webmproject/libvpx.git src

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd src
          ./configure \
            --prefix="$GITHUB_WORKSPACE/dist" \
            --enable-static --disable-shared \
            --disable-examples --disable-tools \
            --disable-docs --disable-unit-tests \
            --enable-vp9 --disable-vp8
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      # Windows step 1: configure generates MSBuild .vcxproj (needs bash/perl/nasm/make).
      # make dist bundles the generated sources + project into a self-contained directory.
      # cl.exe is visible here via path-type: inherit (setup-msvc ran above).
      - name: Configure + generate MSBuild project (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p build && cd build
          ../src/configure \
            --target=x86_64-win64-vs17 \
            --enable-static --disable-shared \
            --disable-examples --disable-tools \
            --disable-docs --disable-unit-tests \
            --enable-vp9 --disable-vp8 \
            --as=nasm
          make dist

      # Windows step 2: compile the generated .vcxproj with MSBuild (MSVC from setup-msvc).
      - name: Build with MSBuild (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location build
          # make dist creates a directory like vpx-vp9-nodocs-x86_64-win64md-vs17-v1.16.0
          $distDir = (Get-ChildItem -Directory | Where-Object { $_.Name -like "vpx-*" } | Select-Object -First 1).FullName
          Write-Host "Dist dir: $distDir"
          Set-Location $distDir
          msbuild vpx.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m
          # Output lib is named vpxmd.lib (/MD) or vpxmt.lib (/MT); rename to vpx.lib
          $lib = Get-ChildItem -Recurse -Filter "vpx*.lib" | Where-Object { $_.DirectoryName -match "Release" } | Select-Object -First 1
          Write-Host "Found lib: $($lib.FullName)"
          $out = "$env:GITHUB_WORKSPACE/dist"
          New-Item -ItemType Directory -Force "$out/lib"
          New-Item -ItemType Directory -Force "$out/include/vpx"
          Copy-Item $lib.FullName "$out/lib/vpx.lib"
          Copy-Item "include\vpx\*" "$out/include/vpx/"

      - uses: ./.github/actions/collect-package-upload
        with:
          lib_name: libvpx
          lib_version: ${{ needs.setup.outputs.lib_version }}
          platform: ${{ matrix.platform }}

  release:
    needs: [setup, build]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "libvpx ${{ needs.setup.outputs.lib_version }}"
    secrets: inherit
