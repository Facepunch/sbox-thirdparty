name: Build qt5

# Builds Facepunch/qt, our patched Qt 5.15.2, and never upstream Qt: the fork carries
# QDockWidget changes the tools UI depends on. It vendors jom and gnuwin32, so all we add is
# MSVC, the checkout and the packaging.
#
# Packaged by hand rather than through collect-package-upload, which flattens everything
# into lib/. Qt needs its moc/rcc/uic host tools and its plugin trees kept as directories.
#
# The archive also carries a runtime/ tree holding just the modules and plugins sbox ships,
# already laid out the way they appear under game/bin, so sbox copies it verbatim.

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'Facepunch/qt ref (branch, tag or commit SHA)'
        required: true
        default: 'master'
  push:
    tags: ['qt5-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#qt5-}"
          else
            V="${{ inputs.lib_version }}"
          fi
          echo "lib_version=$V" >> $GITHUB_OUTPUT
          echo "release_tag=qt5-$V" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: windows-latest
    name: win64
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-msvc

      # LFS matters here - the fork stores build tooling (jom, gnuwin32) in LFS, and a
      # non-LFS checkout silently yields pointer files that fail at exec time.
      - name: Clone Facepunch/qt ${{ needs.setup.outputs.lib_version }}
        uses: actions/checkout@v4
        with:
          repository: Facepunch/qt
          ref: ${{ needs.setup.outputs.lib_version }}
          path: qt
          lfs: true
          submodules: recursive
          fetch-depth: 1

      - name: Configure
        working-directory: qt/valve
        shell: cmd
        run: fp_config.bat

      - name: Build
        working-directory: qt/valve
        shell: cmd
        run: jom\jom.exe

      - name: Install
        working-directory: qt/valve
        shell: cmd
        run: jom\jom.exe install

      # Mirror the layout src/thirdparty/lgpl/qt5 expects: include/, lib/, bin/ (Qt5Core.dll
      # plus the moc/rcc/uic host tools) and plugins/. The versioned include subdirectories
      # (QtCore/5.15.2/...) are private Qt internals and are dropped, as in the fork's CI.
      - name: Stage dist
        shell: pwsh
        run: |
          $build = "qt\valve\build_win64"
          if (-not (Test-Path $build)) { throw "Qt install prefix $build not found" }

          New-Item -ItemType Directory -Force dist\include, dist\lib, dist\bin, dist\plugins | Out-Null

          foreach ($m in @('QtCore','QtGui','QtWidgets','QtConcurrent','QtNetwork','QtUiTools')) {
            $src = Join-Path $build "include\$m"
            if (Test-Path $src) {
              Copy-Item -Recurse -Force $src dist\include\
              Get-ChildItem "dist\include\$m" -Directory -Filter '5.15.2*' |
                Remove-Item -Recurse -Force
            }
          }

          Copy-Item "$build\lib\Qt5*.lib" dist\lib\
          Copy-Item "$build\bin\Qt5*.dll" dist\bin\

          # Symbols for the Qt frames in an editor crash. Qt puts them next to either the
          # dll or the lib depending on the module, so search the prefix.
          $pdbs = Get-ChildItem $build -Recurse -Filter "Qt5*.pdb" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\plugins\\' }
          if ( $pdbs ) { $pdbs | Copy-Item -Destination dist\bin\ -Force }
          else { Write-Host "::warning::no Qt5 pdbs found under $build" }
          foreach ($tool in @('moc','rcc','uic')) {
            Get-ChildItem "$build\bin" -Filter "$tool.*" | Copy-Item -Destination dist\bin\
          }
          foreach ($p in @('platforms','imageformats')) {
            if (Test-Path "$build\plugins\$p") {
              Copy-Item -Recurse -Force "$build\plugins\$p" dist\plugins\
            }
          }

          if (-not (Get-ChildItem dist\lib -Filter Qt5Core.lib)) { throw "Qt5Core.lib missing from staged output" }

          # runtime/ is what sbox copies beside the engine, laid out as it lands there. Qt builds
          # far more than the editor loads, so the shipped set is named here rather than in sbox.
          # Concurrent is not linked but Core pulls it in.
          New-Item -ItemType Directory -Force dist\runtime\qt5_plugins\imageformats, dist\runtime\qt5_plugins\platforms | Out-Null
          foreach ($m in @('Qt5Concurrent','Qt5Core','Qt5Gui','Qt5Widgets')) {
            Get-ChildItem dist\bin -Filter "$m.*" | Copy-Item -Destination dist\runtime\
          }
          foreach ($p in @('qgif','qico','qjpeg','qtga','qwbmp')) {
            Get-ChildItem dist\plugins\imageformats -Filter "$p.*" -ErrorAction SilentlyContinue |
              Copy-Item -Destination dist\runtime\qt5_plugins\imageformats\
          }
          Get-ChildItem dist\plugins\platforms -Filter "qwindows.*" |
            Copy-Item -Destination dist\runtime\qt5_plugins\platforms\

          foreach ($required in @('Qt5Core.dll', 'Qt5Gui.dll', 'Qt5Widgets.dll',
                                  'qt5_plugins\imageformats\qjpeg.dll', 'qt5_plugins\platforms\qwindows.dll')) {
            if (-not (Test-Path "dist\runtime\$required")) { throw "runtime\$required missing from staged output" }
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath "qt5-${{ needs.setup.outputs.lib_version }}-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: qt5-win64
          path: qt5-${{ needs.setup.outputs.lib_version }}-win64.zip

  build-linux:
    needs: setup
    # Container jobs default to sh (dash on sniper). Stage dist uses nullglob and brace
    # expansion; without bash, linuxsteamrt64 dies at `shopt: not found`.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # linuxsteamrt64 builds inside the Steam Runtime 3 (sniper) SDK so the shipped Qt only
          # needs symbols the runtime has. On a bare runner it picked up the host's glibc.
          - { os: ubuntu-24.04,     platform: linuxsteamrt64, container: 'registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20260805.254768' }
          - { os: ubuntu-24.04-arm, platform: linuxsteamrtarm64 }
          - { os: macos-26,         platform: osxarm64 }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: ${{ matrix.platform }}
    timeout-minutes: 300

    steps:
      # The image runs as root and carries neither sudo nor git-lfs; the Facepunch/qt checkout
      # below is an LFS repo and the dep step calls sudo.
      - name: Prepare Steam Runtime container
        if: matrix.container != ''
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo git-lfs ca-certificates

      - uses: actions/checkout@v4

      # Qt needs the X11/xcb/fontconfig development headers to build the platform plugin.
      # Without them configure silently drops xcb and the result cannot open a window.
      - name: Install build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libgl1-mesa-dev libfontconfig1-dev             libfreetype-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev             libxi-dev libxrender-dev libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev             libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev             libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev             libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev             libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev patchelf

      - name: Clone Facepunch/qt ${{ needs.setup.outputs.lib_version }}
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: Facepunch/qt
          ref: ${{ needs.setup.outputs.lib_version }}
          path: qt
          lfs: true
          submodules: recursive
          fetch-depth: 1

      # The fork does not build on macOS: upstream qtbase plus its changes as a patch, into
      # qt/valve so every step below is shared.
      - name: Clone and configure Qt
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --branch v5.15.19-lts-lgpl https://github.com/qt/qtbase.git qt/valve
          cd qt/valve
          patch -p1 --forward --batch < "$GITHUB_WORKSPACE/.github/patches/qt5/sbox.patch"
          ./configure -prefix "$PWD/build_linux64" -opensource -confirm-license -release -force-debug-info -nomake examples -nomake tests -nomake tools -no-opengl -no-openssl -no-icu -no-framework

      # Mirrors valve/fp_config.bat, which is Windows only - same module skips and the
      # same -no-opengl/-no-openssl/-release choices, driven through the Unix configure.
      # -no-icu is added on top: configure would otherwise auto-detect whatever ICU the build
      # image happens to carry and leave libQt5Core needing that libicu*.so at run time, which
      # is a version gamble on any machine the result lands on. -no-icu makes Qt use its
      # built-in Unicode tables instead, so the shipped libraries are self-contained.
      - name: Configure
        if: runner.os == 'Linux'
        working-directory: qt/valve
        run: |
          # The checkout does not preserve exec bits, and the top level configure
          # delegates to qtbase/configure and its config.tests helpers.
          chmod +x configure qtbase/configure 2>/dev/null || true
          find . -maxdepth 4 -name configure -type f -exec chmod +x {} + 2>/dev/null || true
          find . -maxdepth 4 -path '*config.tests*' -name '*.sh' -exec chmod +x {} + 2>/dev/null || true
          ./configure             -prefix "$PWD/build_linux64"             -opensource -confirm-license             -release -force-debug-info             -nomake examples -nomake tests -nomake tools             -no-opengl -no-openssl -no-icu             -skip 3d -skip activeqt -skip androidextras -skip charts             -skip connectivity -skip datavis3d -skip declarative -skip doc             -skip gamepad -skip graphicaleffects -skip location -skip lottie             -skip macextras -skip multimedia -skip networkauth -skip purchasing             -skip quick3d -skip quickcontrols -skip quickcontrols2             -skip quicktimeline -skip remoteobjects -skip script -skip scxml             -skip sensors -skip serialbus -skip serialport -skip speech             -skip svg -skip translations -skip virtualkeyboard -skip wayland             -skip webchannel -skip webengine -skip webglplugin -skip websockets             -skip webview -skip x11extras -skip xmlpatterns

      - name: Build
        working-directory: qt/valve
        run: make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Install
        working-directory: qt/valve
        run: make install

      # The fork bundles these, upstream qtbase does not; sbox needs QtUiTools and the image plugins.
      - name: Build qttools and qtimageformats
        if: runner.os == 'macOS'
        run: |
          qmake="$GITHUB_WORKSPACE/qt/valve/build_linux64/bin/qmake"
          git clone --depth 1 --branch v5.15.19-lts-lgpl https://github.com/qt/qttools.git qttools
          git clone --depth 1 --branch v5.15.19-lts-lgpl https://github.com/qt/qtimageformats.git qtimageformats
          (cd qttools/src/designer/src && "$qmake" && make sub-uiplugin sub-uitools -j"$(sysctl -n hw.ncpu)" && make sub-uiplugin-install_subtargets sub-uitools-install_subtargets)
          (cd qtimageformats && "$qmake" && make -j"$(sysctl -n hw.ncpu)" && make install)

      - name: Stage dist
        working-directory: qt/valve
        run: |
          build="$PWD/build_linux64"
          [ -d "$build" ] || { echo "Qt install prefix $build not found"; exit 1; }

          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out/include" "$out/lib" "$out/bin" "$out/plugins"

          for m in QtCore QtGui QtWidgets QtConcurrent QtNetwork QtUiTools; do
            if [ -d "$build/include/$m" ]; then
              cp -r "$build/include/$m" "$out/include/"
              rm -rf "$out/include/$m"/5.15.*
            fi
          done

          cp -a "$build"/lib/libQt5*.so* "$out/lib/" 2>/dev/null || true
          cp -a "$build"/lib/libQt5*.dylib "$out/lib/" 2>/dev/null || true
          cp -a "$build"/lib/libQt5*.a "$out/lib/" 2>/dev/null || true
          for tool in moc rcc uic; do
            [ -f "$build/bin/$tool" ] && cp "$build/bin/$tool" "$out/bin/"
          done
          for p in platforms imageformats; do
            [ -d "$build/plugins/$p" ] && cp -r "$build/plugins/$p" "$out/plugins/"
          done

          ls "$out/lib" | grep -q "libQt5Core" || { echo "libQt5Core missing from staged output"; exit 1; }

          # See the Windows job: runtime/ is the shipped set, laid out as it lands in game/bin.
          # The module list is the dependency closure the xcb platform plugin drags in, not just
          # what sbox links against: the plugin needs libQt5XcbQpa, which in turn needs libQt5DBus,
          # and neither is a direct sbox dependency - miss them and the plugin fails to load with
          # "could not load the Qt platform plugin xcb".
          mkdir -p "$out/runtime/qt5_plugins/imageformats" "$out/runtime/qt5_plugins/platforms"
          for m in Concurrent Core DBus Gui Widgets XcbQpa $([ "$RUNNER_OS" = macOS ] && echo PrintSupport); do # libqcocoa needs it
            cp -a "$out"/lib/libQt5$m.so* "$out"/lib/libQt5$m*.dylib "$out/runtime/" 2>/dev/null || true
          done
          for p in qgif qjpeg qwbmp; do
            cp -a "$out/plugins/imageformats/lib$p.so" "$out/runtime/qt5_plugins/imageformats/" 2>/dev/null || true
            cp -a "$out/plugins/imageformats/lib$p.dylib" "$out/runtime/qt5_plugins/imageformats/" 2>/dev/null || true
          done
          cp -a "$out"/plugins/platforms/libq{xcb.so,cocoa.dylib} "$out/runtime/qt5_plugins/platforms/" 2>/dev/null || true

          # Qt links its plugins with RUNPATH $ORIGIN/../../lib, for its usual prefix/lib +
          # prefix/plugins/<category> layout. runtime/ is flattened - the Qt libraries sit at its
          # root (beside the engine under game/bin), not in a lib/ subdir - so that rpath points at
          # a runtime/lib that does not exist, and the plugin cannot find libQt5XcbQpa etc. Repoint
          # each plugin at the flattened layout: from runtime/qt5_plugins/<category>/ the modules
          # are two directories up. (libQt5XcbQpa keeps its own $ORIGIN rpath, already correct once
          # it sits at the root.) This is the same $ORIGIN-relative patchelf that linuxdeployqt and
          # cqtdeployer apply when they bundle Qt.
          # Same on macOS, minus the modules: Qt already gives those @rpath install names and an
          # @loader_path rpath. nullglob: on either OS one of these two globs matches nothing.
          shopt -s nullglob
          for plugin in "$out"/runtime/qt5_plugins/*/*.so; do
            patchelf --set-rpath '$ORIGIN/../..' "$plugin"
          done
          for plugin in "$out"/runtime/qt5_plugins/*/*.dylib; do
            install_name_tool -add_rpath "@loader_path/../.." "$plugin"
          done

          # The copies above tolerate the other OS's glob missing; catch a genuinely absent module here.
          ls "$out/runtime/qt5_plugins/platforms" | grep -qE 'qxcb|qcocoa' || { echo "runtime platform plugin missing"; exit 1; }
          for m in Concurrent Core DBus Gui Widgets $([ "$RUNNER_OS" = macOS ] && echo PrintSupport || echo XcbQpa); do
            ls "$out/runtime" | grep -q "libQt5$m\." || { echo "runtime libQt5$m missing"; exit 1; }
          done

      - name: Package
        run: tar czf "qt5-${{ needs.setup.outputs.lib_version }}-${{ matrix.platform }}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: qt5-${{ matrix.platform }}
          path: qt5-${{ needs.setup.outputs.lib_version }}-${{ matrix.platform }}.tar.gz

  release:
    needs: [setup, build, build-linux]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "qt5 (Facepunch/qt ${{ needs.setup.outputs.lib_version }})"
