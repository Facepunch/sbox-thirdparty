name: Build qt5

# Builds Facepunch/qt, our patched Qt 5.15.2, and never upstream Qt: the fork carries
# QDockWidget changes the tools UI depends on. It vendors jom and gnuwin32, so all we add is
# MSVC, the checkout and the packaging.
#
# Packaged by hand rather than through collect-package-upload, which flattens everything
# into lib/. Qt needs its moc/rcc/uic host tools and its plugin trees kept as directories.
#
# The archive also carries a runtime/ tree holding just the modules and plugins sbox ships,
# already laid out the way they appear under game/bin, so sbox copies it verbatim.

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'Facepunch/qt ref (branch, tag or commit SHA)'
        required: true
        default: 'master'
  push:
    tags: ['qt5-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#qt5-}"
          else
            V="${{ inputs.lib_version }}"
          fi
          echo "lib_version=$V" >> $GITHUB_OUTPUT
          echo "release_tag=qt5-$V" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: windows-latest
    name: win64
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-msvc

      # LFS matters here - the fork stores build tooling (jom, gnuwin32) in LFS, and a
      # non-LFS checkout silently yields pointer files that fail at exec time.
      - name: Clone Facepunch/qt ${{ needs.setup.outputs.lib_version }}
        uses: actions/checkout@v4
        with:
          repository: Facepunch/qt
          ref: ${{ needs.setup.outputs.lib_version }}
          path: qt
          lfs: true
          submodules: recursive
          fetch-depth: 1

      - name: Configure
        working-directory: qt/valve
        shell: cmd
        run: fp_config.bat

      - name: Build
        working-directory: qt/valve
        shell: cmd
        run: jom\jom.exe

      - name: Install
        working-directory: qt/valve
        shell: cmd
        run: jom\jom.exe install

      # Mirror the layout src/thirdparty/lgpl/qt5 expects: include/, lib/, bin/ (Qt5Core.dll
      # plus the moc/rcc/uic host tools) and plugins/. The versioned include subdirectories
      # (QtCore/5.15.2/...) are private Qt internals and are dropped, as in the fork's CI.
      - name: Stage dist
        shell: pwsh
        run: |
          $build = "qt\valve\build_win64"
          if (-not (Test-Path $build)) { throw "Qt install prefix $build not found" }

          New-Item -ItemType Directory -Force dist\include, dist\lib, dist\bin, dist\plugins | Out-Null

          foreach ($m in @('QtCore','QtGui','QtWidgets','QtConcurrent','QtNetwork','QtUiTools')) {
            $src = Join-Path $build "include\$m"
            if (Test-Path $src) {
              Copy-Item -Recurse -Force $src dist\include\
              Get-ChildItem "dist\include\$m" -Directory -Filter '5.15.2*' |
                Remove-Item -Recurse -Force
            }
          }

          Copy-Item "$build\lib\Qt5*.lib" dist\lib\
          Copy-Item "$build\bin\Qt5*.dll" dist\bin\

          # Symbols for the Qt frames in an editor crash. Qt puts them next to either the
          # dll or the lib depending on the module, so search the prefix.
          $pdbs = Get-ChildItem $build -Recurse -Filter "Qt5*.pdb" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\plugins\\' }
          if ( $pdbs ) { $pdbs | Copy-Item -Destination dist\bin\ -Force }
          else { Write-Host "::warning::no Qt5 pdbs found under $build" }
          foreach ($tool in @('moc','rcc','uic')) {
            Get-ChildItem "$build\bin" -Filter "$tool.*" | Copy-Item -Destination dist\bin\
          }
          foreach ($p in @('platforms','imageformats')) {
            if (Test-Path "$build\plugins\$p") {
              Copy-Item -Recurse -Force "$build\plugins\$p" dist\plugins\
            }
          }

          if (-not (Get-ChildItem dist\lib -Filter Qt5Core.lib)) { throw "Qt5Core.lib missing from staged output" }

          # runtime/ is what sbox copies beside the engine, laid out as it lands there. Qt builds
          # far more than the editor loads, so the shipped set is named here rather than in sbox.
          # Concurrent is not linked but Core pulls it in.
          New-Item -ItemType Directory -Force dist\runtime\qt5_plugins\imageformats, dist\runtime\qt5_plugins\platforms | Out-Null
          foreach ($m in @('Qt5Concurrent','Qt5Core','Qt5Gui','Qt5Widgets')) {
            Get-ChildItem dist\bin -Filter "$m.*" | Copy-Item -Destination dist\runtime\
          }
          foreach ($p in @('qgif','qico','qjpeg','qtga','qwbmp')) {
            Get-ChildItem dist\plugins\imageformats -Filter "$p.*" -ErrorAction SilentlyContinue |
              Copy-Item -Destination dist\runtime\qt5_plugins\imageformats\
          }
          Get-ChildItem dist\plugins\platforms -Filter "qwindows.*" |
            Copy-Item -Destination dist\runtime\qt5_plugins\platforms\

          foreach ($required in @('Qt5Core.dll', 'Qt5Gui.dll', 'Qt5Widgets.dll',
                                  'qt5_plugins\imageformats\qjpeg.dll', 'qt5_plugins\platforms\qwindows.dll')) {
            if (-not (Test-Path "dist\runtime\$required")) { throw "runtime\$required missing from staged output" }
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath "qt5-${{ needs.setup.outputs.lib_version }}-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: qt5-win64
          path: qt5-${{ needs.setup.outputs.lib_version }}-win64.zip

  build-linux:
    needs: setup
    runs-on: ubuntu-24.04
    name: linuxsteamrt64
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      # Qt needs the X11/xcb/fontconfig development headers to build the platform plugin.
      # Without them configure silently drops xcb and the result cannot open a window.
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libgl1-mesa-dev libfontconfig1-dev             libfreetype-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev             libxi-dev libxrender-dev libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev             libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev             libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev             libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev             libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev

      - name: Clone Facepunch/qt ${{ needs.setup.outputs.lib_version }}
        uses: actions/checkout@v4
        with:
          repository: Facepunch/qt
          ref: ${{ needs.setup.outputs.lib_version }}
          path: qt
          lfs: true
          submodules: recursive
          fetch-depth: 1

      # Mirrors valve/fp_config.bat, which is Windows only - same module skips and the
      # same -no-opengl/-no-openssl/-release choices, driven through the Unix configure.
      - name: Configure
        working-directory: qt/valve
        run: |
          # The checkout does not preserve exec bits, and the top level configure
          # delegates to qtbase/configure and its config.tests helpers.
          chmod +x configure qtbase/configure 2>/dev/null || true
          find . -maxdepth 4 -name configure -type f -exec chmod +x {} + 2>/dev/null || true
          find . -maxdepth 4 -path '*config.tests*' -name '*.sh' -exec chmod +x {} + 2>/dev/null || true
          ./configure             -prefix "$PWD/build_linux64"             -opensource -confirm-license             -release -force-debug-info             -nomake examples -nomake tests -nomake tools             -no-opengl -no-openssl             -skip 3d -skip activeqt -skip androidextras -skip charts             -skip connectivity -skip datavis3d -skip declarative -skip doc             -skip gamepad -skip graphicaleffects -skip location -skip lottie             -skip macextras -skip multimedia -skip networkauth -skip purchasing             -skip quick3d -skip quickcontrols -skip quickcontrols2             -skip quicktimeline -skip remoteobjects -skip script -skip scxml             -skip sensors -skip serialbus -skip serialport -skip speech             -skip svg -skip translations -skip virtualkeyboard -skip wayland             -skip webchannel -skip webengine -skip webglplugin -skip websockets             -skip webview -skip x11extras -skip xmlpatterns

      - name: Build
        working-directory: qt/valve
        run: make -j"$(nproc)"

      - name: Install
        working-directory: qt/valve
        run: make install

      - name: Stage dist
        working-directory: qt/valve
        run: |
          build="$PWD/build_linux64"
          [ -d "$build" ] || { echo "Qt install prefix $build not found"; exit 1; }

          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out/include" "$out/lib" "$out/bin" "$out/plugins"

          for m in QtCore QtGui QtWidgets QtConcurrent QtNetwork QtUiTools; do
            if [ -d "$build/include/$m" ]; then
              cp -r "$build/include/$m" "$out/include/"
              rm -rf "$out/include/$m"/5.15.2*
            fi
          done

          cp -a "$build"/lib/libQt5*.so* "$out/lib/" 2>/dev/null || true
          cp -a "$build"/lib/libQt5*.a "$out/lib/" 2>/dev/null || true
          for tool in moc rcc uic; do
            [ -f "$build/bin/$tool" ] && cp "$build/bin/$tool" "$out/bin/"
          done
          for p in platforms imageformats; do
            [ -d "$build/plugins/$p" ] && cp -r "$build/plugins/$p" "$out/plugins/"
          done

          ls "$out/lib" | grep -q "libQt5Core" || { echo "libQt5Core missing from staged output"; exit 1; }

          # See the Windows job: runtime/ is the shipped set, laid out as it lands in game/bin.
          mkdir -p "$out/runtime/qt5_plugins/imageformats" "$out/runtime/qt5_plugins/platforms"
          for m in Concurrent Core Gui Widgets; do
            cp -a "$out"/lib/libQt5$m.so* "$out/runtime/"
          done
          for p in qgif qjpeg qwbmp; do
            cp -a "$out/plugins/imageformats/lib$p.so" "$out/runtime/qt5_plugins/imageformats/" 2>/dev/null || true
          done
          cp -a "$out/plugins/platforms/libqxcb.so" "$out/runtime/qt5_plugins/platforms/"

          ls "$out/runtime" | grep -q "libQt5Core" || { echo "runtime libQt5Core missing"; exit 1; }
          [ -f "$out/runtime/qt5_plugins/platforms/libqxcb.so" ] || { echo "runtime libqxcb.so missing"; exit 1; }

      - name: Package
        run: tar czf "qt5-${{ needs.setup.outputs.lib_version }}-linuxsteamrt64.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: qt5-linuxsteamrt64
          path: qt5-${{ needs.setup.outputs.lib_version }}-linuxsteamrt64.tar.gz

  release:
    needs: [setup, build, build-linux]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "qt5 (Facepunch/qt ${{ needs.setup.outputs.lib_version }})"
