name: Build embree

# No ISPC, internal tasking so TBB is not pulled in, and no tutorials. Source 2 links the
# static embree3.
#
# Stay on 3.x. The API is stable across it, and 4 is a different one.

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'embree tag (e.g. v3.13.5)'
        required: true
        default: 'v3.13.5'
  push:
    tags: ['embree-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#embree-}"
          else
            V="${{ inputs.lib_version }}"
          fi
          echo "lib_version=$V" >> $GITHUB_OUTPUT
          echo "release_tag=embree-$V" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win64 }
          - { os: ubuntu-24.04,   platform: linuxsteamrt64, container: 'registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20260805.254768' }
          - { os: ubuntu-24.04-arm, platform: linuxsteamrtarm64 }
          - { os: macos-26,         platform: osxarm64 }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: ${{ matrix.platform }}
    # win64 takes about two hours: MSVC compiles the kernel set once per ISA.
    timeout-minutes: 240

    steps:
      # linuxsteamrt64 builds run inside the Steam Runtime 3 (sniper) SDK so their output only
      # needs symbols the runtime actually has. Building on ubuntu-latest instead is what left
      # these libraries needing GLIBC_2.38 when sniper provides 2.31. The image carries neither
      # sudo nor git-lfs, which actions/checkout and the dep steps below expect.
      - name: Prepare Steam Runtime container
        if: matrix.container != ''
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo git-lfs ca-certificates

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-msvc
        if: runner.os == 'Windows'

      - name: Install cmake + ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Clone embree ${{ needs.setup.outputs.lib_version }}
        run: git clone --depth 1 --branch ${{ needs.setup.outputs.lib_version }} https://github.com/embree/embree src

      # Do not trim the lower ISAs with the individual EMBREE_ISA_* switches. Making AVX the
      # lowest makes it the base ISA too, so the core kernels land in embree3 already
      # namespaced embree::avx and collide with embree_avx when the libraries are merged.
      # On ARM, EMBREE_ARM must be a cache var (auto-detection runs after the compiler cmake
      # files read it) and sse2neon.h needs -flax-vector-conversions on GCC 13+, hence the IGNORE
      # opt-out that stops those files blanking CMAKE_CXX_FLAGS.
      - name: Select ISA flags
        id: isa
        shell: bash
        run: echo "flags=$([[ '${{ matrix.platform }}' == *arm64 ]] && echo -DEMBREE_ARM:BOOL=ON -DEMBREE_IGNORE_CMAKE_CXX_FLAGS:BOOL=OFF -DCMAKE_CXX_FLAGS=-flax-vector-conversions || echo -DEMBREE_MAX_ISA=AVX2 -DEMBREE_ISA_AVX512=OFF)" >> $GITHUB_OUTPUT

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          # Apple clang rejects two NEON-path headers (bad union members, ostream on a field
          # without one) and sse2neon's _mm_stream_pd, which stores through the wrong vector type.
          # Applied on both ARM platforms so they build the same source; GCC never compiles the
          # _mm_stream_pd builtin branch and v0/v1 name the same members u.lower/u.upper alias.
          [[ "${{ matrix.platform }}" != *arm64 ]] || sed -i.bak -e 's/a\.u\.lower/a.v0/g' -e 's/a\.u\.upper/a.v1/g' -e 's/line\.v0 << ", " << //' src/kernels/subdiv/bezier_curve.h src/kernels/geometry/pointi.h
          [[ "${{ matrix.platform }}" != *arm64 ]] || sed -i.bak '/_mm_stream_pd/,/^}/s/(float32x4_t \*) p/(float64x2_t *) p/' src/common/simd/arm/sse2neon.h
          cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DEMBREE_STATIC_LIB=ON \
            -DEMBREE_ISPC_SUPPORT=OFF \
            -DEMBREE_TASKING_SYSTEM=INTERNAL \
            -DEMBREE_TUTORIALS=OFF \
            -DEMBREE_ZIP_MODE=OFF \
            ${{ steps.isa.outputs.flags }}
          cmake --build src/build --parallel
          cmake --install src/build

      # The CRT has to be spelled into the flags. CMAKE_MSVC_RUNTIME_LIBRARY plus CMP0091
      # is not enough here: the objects still come out /MD, and cl defaults to /MD when no
      # flag reaches it. embree appends to CMAKE_CXX_FLAGS_RELEASE rather than overwriting
      # it, so /MT set here survives. Do not switch to the USE_STATIC_RUNTIME option that
      # embree's own compilation.md documents; it is not implemented in 3.13.x.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S src -B src\build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\dist" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            "-DCMAKE_CXX_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG" `
            "-DCMAKE_C_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG" `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            -DEMBREE_STATIC_LIB=ON `
            -DEMBREE_ISPC_SUPPORT=OFF `
            -DEMBREE_TASKING_SYSTEM=INTERNAL `
            -DEMBREE_TUTORIALS=OFF `
            -DEMBREE_ZIP_MODE=OFF `
            ${{ steps.isa.outputs.flags }}
          cmake --build src\build --parallel
          cmake --install src\build

      # sbox links embree3 alone, but embree splits its symbols across tasking, sys, math,
      # simd, lexers and the per ISA libs, so merge them into it.
      - name: Merge static libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libs = Get-ChildItem dist\lib -Filter *.lib | ForEach-Object { $_.FullName }
          if ( $libs.Count -lt 2 ) { throw "expected several embree libs to merge, found $($libs.Count)" }
          lib /nologo /OUT:"$env:GITHUB_WORKSPACE\embree3_merged.lib" $libs
          if ( $LASTEXITCODE -ne 0 ) { throw "lib.exe merge failed" }
          Remove-Item dist\lib\*.lib -Force
          Move-Item "$env:GITHUB_WORKSPACE\embree3_merged.lib" dist\lib\embree3.lib
          # LINKERMEMBER lists just the archive's public symbols, so this stays cheap.
          if ( -not ( dumpbin /nologo /LINKERMEMBER:1 dist\lib\embree3.lib | Select-String threadID ) )
          {
            throw "merged lib is missing TaskScheduler"
          }
          # A dynamic CRT here fails at link time in sbox, so catch it now.
          if ( dumpbin /nologo /DIRECTIVES dist\lib\embree3.lib | Select-String "DEFAULTLIB:MSVCRT" )
          {
            throw "embree3.lib is linked against the dynamic CRT"
          }

      # ar -M merges archives in place. Extracting first would lose objects, since each
      # per ISA library carries its own bvh.cpp.o.
      - name: Merge static libraries (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist/lib
          count=$(ls *.a | wc -l)
          if [ "$count" -lt 2 ]; then echo "expected several embree libs to merge, found $count"; exit 1; fi
          merged="$GITHUB_WORKSPACE/libembree3_merged.a"
          if [ "$RUNNER_OS" = macOS ]; then libtool -static -o "$merged" *.a; else
          { echo "create $merged"
            for a in *.a; do echo "addlib $a"; done
            echo "save"; echo "end"; } | ar -M
          fi
          rm -f *.a
          mv "$merged" libembree3.a
          # --defined-only, or an undefined reference to the symbol satisfies the check.
          nm -C --defined-only libembree3.a | grep -q "TaskScheduler::threadID" || { echo "merged lib is missing TaskScheduler"; exit 1; }

      # embree's install drops the MSVC redistributables next to its libraries and the
      # packaging step globs every dll, so they end up in the archive. We ship our own
      # runtime; drop them rather than overwrite anyone's.
      - name: Drop MSVC redistributables
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem dist -Recurse -Include msvcp*.dll,vcruntime*.dll,concrt*.dll | Remove-Item -Force

      - uses: ./.github/actions/collect-package-upload
        with:
          lib_name: embree
          lib_version: ${{ needs.setup.outputs.lib_version }}
          platform: ${{ matrix.platform }}

  release:
    needs: [setup, build]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "embree ${{ needs.setup.outputs.lib_version }}"
