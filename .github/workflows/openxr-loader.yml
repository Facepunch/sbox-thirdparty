name: Build openxr-loader

# The OpenXR loader that engine2.build.cs links as openxr_loader.lib, plus the SDK headers
# that fpxr compiles against. cmake --install stages the public openxr/ ones; xr_linear.h is
# a common helper the install tree leaves behind, so it is mirrored in below.

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'OpenXR-SDK tag (e.g. release-1.1.43)'
        required: true
        default: 'release-1.1.43'
  push:
    tags: ['openxr-loader-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#openxr-loader-}"
          else
            V="${{ inputs.lib_version }}"
          fi
          echo "lib_version=$V" >> $GITHUB_OUTPUT
          echo "release_tag=openxr-loader-$V" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   platform: win64 }
          - { os: ubuntu-24.04,     platform: linuxsteamrt64 }
          - { os: ubuntu-24.04-arm, platform: linuxsteamrtarm64 }
          - { os: macos-26,         platform: osxarm64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-msvc
        if: runner.os == 'Windows'

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build pkg-config \
            libx11-dev libxxf86vm-dev libxrandr-dev libxcb1-dev \
            libwayland-dev wayland-protocols

      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone OpenXR-SDK ${{ needs.setup.outputs.lib_version }}
        run: git clone --depth 1 --branch ${{ needs.setup.outputs.lib_version }} https://github.com/KhronosGroup/OpenXR-SDK src

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DDYNAMIC_LOADER=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_API_LAYERS=OFF
          cmake --build src/build --parallel
          cmake --install src/build

      # /MD: the loader ships as openxr_loader.dll.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S src -B src\build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\dist" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DDYNAMIC_LOADER=ON `
            -DBUILD_TESTS=OFF `
            -DBUILD_API_LAYERS=OFF
          cmake --build src\build --parallel
          cmake --install src\build

      # fpxr includes "xr_linear.h", a header only math helper that lives in the SDK's
      # src/common rather than its install tree. Take it from the checkout so the release
      # carries every header sbox compiles against.
      - name: Mirror xr_linear.h (Unix)
        if: runner.os != 'Windows'
        run: |
          cp src/src/common/xr_linear.h dist/include/
          test -f dist/include/xr_linear.h

      - name: Mirror xr_linear.h (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Force src\src\common\xr_linear.h dist\include\
          if (-not (Test-Path dist\include\xr_linear.h)) { throw "xr_linear.h missing from staged headers" }

      - uses: ./.github/actions/collect-package-upload
        with:
          lib_name: openxr-loader
          lib_version: ${{ needs.setup.outputs.lib_version }}
          platform: ${{ matrix.platform }}

  release:
    needs: [setup, build]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "openxr-loader ${{ needs.setup.outputs.lib_version }}"
