name: Build FidelityFX-FSR3

# AMD FidelityFX SDK, Vulkan backend only - sbox links ffx_fsr3upscaler_x64.lib and
# ffx_backend_vk_x64.lib. win64 only, since the SDK's shader compilation step targets the
# Windows toolchain.
#
# Stay on 1.1.x. AMD never tagged the 1.0.x that sbox vendors, and FSR 3.1 moved to the
# ffx-api model, so 2.x is a source change rather than a version bump.

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'FidelityFX-SDK tag (e.g. v1.1.4)'
        required: true
        default: 'v1.1.4'
  push:
    tags: ['fidelityfx-fsr3-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#fidelityfx-fsr3-}"
          else
            V="${{ inputs.lib_version }}"
          fi
          echo "lib_version=$V" >> $GITHUB_OUTPUT
          echo "release_tag=fidelityfx-fsr3-$V" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: windows-latest
    name: win64
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-msvc

      # core.autocrlf=false keeps upstream's LF bytes on disk. With the runner default the
      # checkout gets CRLF and the patch below fails to find its context lines.
      - name: Clone FidelityFX-SDK ${{ needs.setup.outputs.lib_version }}
        run: git -c core.autocrlf=false clone --depth 1 --recurse-submodules --shallow-submodules --branch ${{ needs.setup.outputs.lib_version }} https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK src

      # sbox never links vulkan-1; it loads Vulkan through volk at runtime, so the backend
      # has to be built against volk's function pointers rather than the import library.
      # Without this the resulting .lib pulls in vulkan-1 imports that sbox cannot resolve.
      # git apply fails loudly if a version bump moves the code out from under the patch,
      # which is the point - better a red build than a silently unpatched backend.
      # bash, not the pwsh default: PowerShell hands the literal *.patch to git instead of
      # expanding it. GitHub runs bash with -e, so a failed apply still fails the build.
      - name: Apply patches
        shell: bash
        working-directory: src
        run: |
          for patch in ../patches/fidelityfx-fsr3/*.patch; do
            echo "Applying $patch"
            git apply --verbose "$patch"
          done

      # volk.h is pinned to VOLK_HEADER_VERSION 304, matching src/thirdparty/vulkan/volk
      # in sbox, so the backend compiles against the same declarations it links against.
      # VK_NO_PROTOTYPES is set build-wide below rather than only in the patched header:
      # other backend sources include <vulkan/vulkan.h> directly, and without it their
      # prototypes collide with volk's function pointers.
      - name: Fetch volk
        run: git clone --depth 1 --branch ${{ env.VOLK_VERSION }} https://github.com/zeux/volk volk
        env:
          VOLK_VERSION: '1.4.304'

      # The SDK compiles its shader permutations through FidelityFX_SC, which shells out
      # to glslangValidator/dxc from the Vulkan SDK.
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile vulkan_sdk.exe
          Start-Process -FilePath .\vulkan_sdk.exe -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait -NoNewWindow
          $sdk = (Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdk) { throw "Vulkan SDK not found after install" }
          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$sdk"
          Add-Content -Path $env:GITHUB_PATH -Value "$sdk\Bin"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No -G: AMD's CMake assumes a multi-config Visual Studio generator and fails under
      # Ninja with "CMAKE_C_COMPILER not set, after EnableLanguage". Hardcoding a VS
      # generator name is no good either, since the runner image moves between VS major
      # versions (it is on VS 2026 now), so let CMake pick whichever VS is installed.
      - name: Build SDK (Vulkan backend, FSR3)
        shell: pwsh
        working-directory: src/sdk
        run: |
          cmake -B build -A x64 `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            "-DCMAKE_CXX_FLAGS=/DVK_NO_PROTOTYPES /I`"$env:GITHUB_WORKSPACE\volk`"" `
            "-DCMAKE_C_FLAGS=/DVK_NO_PROTOTYPES /I`"$env:GITHUB_WORKSPACE\volk`"" `
            -DFFX_API_BACKEND=VK_X64 `
            -DFFX_FSR3=ON `
            -DFFX_AUTO_COMPILE_SHADERS=ON
          cmake --build build --config Release --parallel

      - name: Stage dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\include, dist\lib | Out-Null
          Copy-Item -Recurse src\sdk\include\* dist\include\
          Get-ChildItem src\sdk -Recurse -Include ffx_fsr3upscaler_x64.lib,ffx_fsr3_x64.lib,ffx_backend_vk_x64.lib,ffx_opticalflow_x64.lib,ffx_frameinterpolation_x64.lib |
            Copy-Item -Destination dist\lib\
          if (-not (Get-ChildItem dist\lib -Filter *.lib)) { throw "No FidelityFX libraries were produced" }

      - uses: ./.github/actions/collect-package-upload
        with:
          lib_name: fidelityfx-fsr3
          lib_version: ${{ needs.setup.outputs.lib_version }}
          platform: win64

  release:
    needs: [setup, build]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "FidelityFX-FSR3 ${{ needs.setup.outputs.lib_version }}"
