name: Build oidn

# Intel Open Image Denoise, used by src/utils/vrad3 to denoise baked lighting.
#
# Stay on 1.4.x: it keeps the oidn 1.x C API (oidnNewDevice / oidnNewFilter /
# oidnSetSharedFilterImage / oidnExecute) that vrad3 calls. 2.x reworks the device model.
#
# No aarch64: 1.x's ISPC kernels only have SSE/AVX targets, so there is nothing to compile
# for NEON. That needs 2.x, which is the API change above.
#
# ISPC comes from its own prebuilt release. TBB is built from source and linked statically,
# because the official binaries import an appcontainer CRT that desktop Windows lacks.

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'oidn tag (e.g. v1.4.3)'
        required: true
        default: 'v1.4.3'
      tbb_version:
        description: 'oneTBB release to build against'
        required: true
        default: '2021.13.0'
      ispc_version:
        description: 'ISPC compiler release'
        required: true
        default: 'v1.25.3'
  push:
    tags: ['oidn-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
      tbb_version: ${{ steps.ver.outputs.tbb_version }}
      ispc_version: ${{ steps.ver.outputs.ispc_version }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#oidn-}"
            TBB="2021.13.0"; ISPC="v1.25.3"
          else
            V="${{ inputs.lib_version }}"
            TBB="${{ inputs.tbb_version }}"; ISPC="${{ inputs.ispc_version }}"
          fi
          echo "lib_version=$V" >> $GITHUB_OUTPUT
          echo "tbb_version=$TBB" >> $GITHUB_OUTPUT
          echo "ispc_version=$ISPC" >> $GITHUB_OUTPUT
          echo "release_tag=oidn-$V" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win64 }
          - { os: ubuntu-24.04,   platform: linuxsteamrt64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-msvc
        if: runner.os == 'Windows'

      - name: Install cmake + ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ISPC ${{ needs.setup.outputs.ispc_version }} (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ needs.setup.outputs.ispc_version }}"
          Invoke-WebRequest -Uri "https://github.com/ispc/ispc/releases/download/$v/ispc-$v-windows.zip" -OutFile ispc.zip
          Expand-Archive ispc.zip -DestinationPath ispc_dl
          $exe = (Get-ChildItem ispc_dl -Recurse -Filter ispc.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "ispc.exe not found in release archive" }
          Add-Content -Path $env:GITHUB_ENV -Value "ISPC_EXECUTABLE=$exe"

      - name: Install ISPC ${{ needs.setup.outputs.ispc_version }} (Linux)
        if: runner.os == 'Linux'
        run: |
          v="${{ needs.setup.outputs.ispc_version }}"
          curl -sSL -o ispc.tar.gz "https://github.com/ispc/ispc/releases/download/$v/ispc-$v-linux.tar.gz"
          mkdir -p ispc_dl && tar -xzf ispc.tar.gz -C ispc_dl
          exe=$(find ispc_dl -type f -name ispc -perm -u+x | head -1)
          if [ -z "$exe" ]; then echo "ispc not found in release archive"; exit 1; fi
          echo "ISPC_EXECUTABLE=$(realpath "$exe")" >> $GITHUB_ENV

      - name: Build oneTBB ${{ needs.setup.outputs.tbb_version }} (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ needs.setup.outputs.tbb_version }}"
          $root = "$env:GITHUB_WORKSPACE\tbb"
          git clone --depth 1 --branch "v$v" https://github.com/uxlfoundation/oneTBB tbb_src
          cmake -S tbb_src -B tbb_src/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$root" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DBUILD_SHARED_LIBS=OFF `
            -DTBB_TEST=OFF -DTBB_EXAMPLES=OFF -DTBB_STRICT=OFF
          cmake --build tbb_src/build --parallel
          cmake --install tbb_src/build
          # oidn's FindTBB does find_library(NAMES tbb), which is what the static build installs
          if (-not (Test-Path "$root/lib/tbb.lib")) { throw "no tbb.lib in $root/lib" }
          Add-Content -Path $env:GITHUB_ENV -Value "TBB_ROOT=$root"

      - name: Build oneTBB ${{ needs.setup.outputs.tbb_version }} (Linux)
        if: runner.os == 'Linux'
        run: |
          v="${{ needs.setup.outputs.tbb_version }}"
          root="$GITHUB_WORKSPACE/tbb"
          git clone --depth 1 --branch "v$v" https://github.com/uxlfoundation/oneTBB tbb_src
          cmake -S tbb_src -B tbb_src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$root" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DTBB_TEST=OFF -DTBB_EXAMPLES=OFF -DTBB_STRICT=OFF
          cmake --build tbb_src/build --parallel
          cmake --install tbb_src/build
          # oidn's FindTBB does find_library(NAMES tbb), which is what the static build installs
          test -f "$root/lib/libtbb.a"
          echo "TBB_ROOT=$root" >> $GITHUB_ENV

      - name: Clone oidn ${{ needs.setup.outputs.lib_version }}
        run: git clone --depth 1 --recurse-submodules --shallow-submodules --branch ${{ needs.setup.outputs.lib_version }} https://github.com/RenderKit/oidn src

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S src -B src\build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\dist" `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            -DISPC_EXECUTABLE="$env:ISPC_EXECUTABLE" `
            -DTBB_ROOT="$env:TBB_ROOT" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DOIDN_STATIC_LIB=OFF `
            -DOIDN_APPS=OFF
          cmake --build src\build --parallel
          cmake --install src\build

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DISPC_EXECUTABLE="$ISPC_EXECUTABLE" \
            -DTBB_ROOT="$TBB_ROOT" \
            -DOIDN_STATIC_LIB=OFF \
            -DOIDN_APPS=OFF
          cmake --build src/build --parallel
          cmake --install src/build

      - uses: ./.github/actions/collect-package-upload
        with:
          lib_name: oidn
          lib_version: ${{ needs.setup.outputs.lib_version }}
          platform: ${{ matrix.platform }}

  release:
    needs: [setup, build]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "oidn ${{ needs.setup.outputs.lib_version }}"
