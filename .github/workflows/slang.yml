name: Build slang

# Builds the Slang shader compiler as shared libraries (slang, slang-rt, slang-glslang,
# slang-glsl-module). The LLVM flavor is disabled so the build does not pull down a
# prebuilt slang-llvm; Source 2 only uses the SPIR-V/GLSL paths.

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'slang tag (e.g. v2025.6.3)'
        required: true
        default: 'v2025.6.3'
  push:
    tags: ['slang-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#slang-}"
          else
            V="${{ inputs.lib_version }}"
          fi
          echo "lib_version=$V" >> $GITHUB_OUTPUT
          echo "release_tag=slang-$V" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   platform: win64 }
          - { os: ubuntu-24.04,     platform: linuxsteamrt64 }
          - { os: ubuntu-24.04-arm, platform: linuxsteamrtarm64 }
          - { os: macos-26,         platform: osxarm64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-msvc
        if: runner.os == 'Windows'

      - name: Install cmake + ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone slang ${{ needs.setup.outputs.lib_version }}
        run: git clone --depth 1 --recurse-submodules --shallow-submodules --branch ${{ needs.setup.outputs.lib_version }} https://github.com/shader-slang/slang src

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DSLANG_SLANG_LLVM_FLAVOR=DISABLE \
            -DSLANG_ENABLE_TESTS=OFF \
            -DSLANG_ENABLE_EXAMPLES=OFF \
            -DSLANG_ENABLE_GFX=OFF \
            -DSLANG_ENABLE_SLANGD=OFF \
            -DSLANG_ENABLE_SLANGRT=ON \
            -DSLANG_LIB_TYPE=SHARED
          cmake --build src/build --parallel
          cmake --install src/build

      # slang is always linked dynamically, so the DLL CRT is the correct choice here
      # (unlike our static libs, which use /MT).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S src -B src\build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\dist" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DSLANG_SLANG_LLVM_FLAVOR=DISABLE `
            -DSLANG_ENABLE_TESTS=OFF `
            -DSLANG_ENABLE_EXAMPLES=OFF `
            -DSLANG_ENABLE_GFX=OFF `
            -DSLANG_ENABLE_SLANGD=OFF `
            -DSLANG_ENABLE_SLANGRT=ON `
            -DSLANG_LIB_TYPE=SHARED
          cmake --build src\build --parallel
          cmake --install src\build

      - uses: ./.github/actions/collect-package-upload
        with:
          lib_name: slang
          lib_version: ${{ needs.setup.outputs.lib_version }}
          platform: ${{ matrix.platform }}

  release:
    needs: [setup, build]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "slang ${{ needs.setup.outputs.lib_version }}"
    secrets: inherit
