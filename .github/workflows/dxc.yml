name: Build dxc

# DirectXShaderCompiler. This is an LLVM fork, so expect 40-90 minutes per platform.
# PredefinedParams.cmake is DXC's own cache file and sets every option their build needs;
# we only add the build type and install prefix on top of it.

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'DXC tag (e.g. v1.9.2607)'
        required: true
        default: 'v1.9.2607'
  push:
    tags: ['dxc-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#dxc-}"
          else
            V="${{ inputs.lib_version }}"
          fi
          echo "lib_version=$V" >> $GITHUB_OUTPUT
          echo "release_tag=dxc-$V" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   platform: win64 }
          - { os: ubuntu-24.04,     platform: linuxsteamrt64, container: 'registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20260805.254768' }
          - { os: ubuntu-24.04-arm, platform: linuxsteamrtarm64 }
          - { os: macos-26,         platform: osxarm64 }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: ${{ matrix.platform }}
    timeout-minutes: 180

    steps:
      # linuxsteamrt64 builds run inside the Steam Runtime 3 (sniper) SDK so their output only
      # needs symbols the runtime actually has. Building on ubuntu-latest instead is what left
      # these libraries needing GLIBC_2.38 when sniper provides 2.31. The image carries neither
      # sudo nor git-lfs, which actions/checkout and the dep steps below expect.
      - name: Prepare Steam Runtime container
        if: matrix.container != ''
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo git-lfs ca-certificates

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-msvc
        if: runner.os == 'Windows'

      - name: Install cmake + ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # setup-python resolves its download against the runner's distro and publishes no build
      # for steamrt, so it is skipped inside the container. sniper ships Python 3.9 as both
      # python and python3, which is what these build scripts want it for.
      - uses: actions/setup-python@v5
        if: matrix.container == ''
        with:
          python-version: '3.12'

      - name: Clone DXC ${{ needs.setup.outputs.lib_version }}
        run: git clone --depth 1 --recurse-submodules --shallow-submodules --branch ${{ needs.setup.outputs.lib_version }} https://github.com/microsoft/DirectXShaderCompiler src

      # DXC's LLVM fork specializes std::is_nothrow_constructible in ADT/StringRef.h, which
      # current Apple Clang rejects as a hard error rather than a warning. Demote it back.
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          EXTRA=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA="-DCMAKE_CXX_FLAGS=-Wno-invalid-specialization"
          fi
          cmake -S src -B src/build -G Ninja \
            -C src/cmake/caches/PredefinedParams.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DHLSL_INCLUDE_TESTS=OFF \
            $EXTRA
          cmake --build src/build --parallel --target dxcompiler dxc

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S src -B src\build -G Ninja `
            -C src\cmake\caches\PredefinedParams.cmake `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\dist" `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DCLANG_INCLUDE_TESTS=OFF `
            -DHLSL_INCLUDE_TESTS=OFF
          cmake --build src\build --parallel --target dxcompiler dxc

      # DXC has no install target that produces an SDK layout, so stage the public headers
      # and the compiler binaries by hand.
      # Only the public headers - src/include/dxc also holds CMakeLists.txt and internal
      # DXIL/DxcBindingTable directories that have no business in a distributed SDK.
      - name: Stage dist (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/include/dxc dist/lib dist/bin
          cp src/include/dxc/*.h dist/include/dxc/ 2>/dev/null || true
          cp -r src/include/dxc/Support dist/include/dxc/ 2>/dev/null || true
          test -f dist/include/dxc/dxcapi.h
          find src/build/lib src/build/bin -maxdepth 1 \( -name "libdxcompiler.so*" -o -name "libdxcompiler*.dylib" \) -exec cp {} dist/lib/ \;
          ls dist/lib/libdxcompiler* >/dev/null
          # sbox regenerates its built-in shaders with the dxc driver, which has to be the
          # same build as the library beside it, so it ships here rather than being found.
          find src/build/bin -maxdepth 1 -name dxc -exec cp {} dist/bin/ \;
          test -f dist/bin/dxc

      - name: Stage dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\include\dxc, dist\lib, dist\bin | Out-Null
          Copy-Item -Force src\include\dxc\*.h dist\include\dxc\
          if ( Test-Path src\include\dxc\Support ) { Copy-Item -Recurse -Force src\include\dxc\Support dist\include\dxc\ }
          if ( -not ( Test-Path dist\include\dxc\dxcapi.h ) ) { throw "dxcapi.h missing from staged headers" }
          Get-ChildItem src\build -Recurse -Include dxcompiler.dll,dxcompiler.lib | Copy-Item -Destination dist\lib\
          if ( -not ( Test-Path dist\lib\dxcompiler.dll ) ) { throw "dxcompiler.dll missing from the staged output" }

          # sbox regenerates its built-in shaders with the dxc driver, which has to be the
          # same build as the library beside it, so it ships here rather than being found.
          Get-ChildItem src\build -Recurse -Filter dxc.exe | Select-Object -First 1 |
            Copy-Item -Destination dist\bin\
          if ( -not ( Test-Path dist\bin\dxc.exe ) ) { throw "dxc.exe missing from the staged output" }

      - uses: ./.github/actions/collect-package-upload
        with:
          include_bin: 'true'
          lib_name: dxc
          lib_version: ${{ needs.setup.outputs.lib_version }}
          platform: ${{ matrix.platform }}

  release:
    needs: [setup, build]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "dxc ${{ needs.setup.outputs.lib_version }}"
