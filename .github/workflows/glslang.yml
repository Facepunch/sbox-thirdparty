name: Build glslang

# Source 2 links SPVRemapper, which is a glslang target, plus SPIRV-Tools and
# SPIRV-Tools-opt, which glslang pulls in as a subproject under ENABLE_OPT=ON. One glslang
# build therefore covers all three, with a single spirv.hpp behind them. That is why this is
# named after glslang and versioned by its tag, even though most of what sbox consumes is
# the SPIR-V tooling; the SPIRV-Tools revision is whatever known_good.json pins.

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'glslang tag (e.g. 14.3.0). SPIRV-Tools/SPIRV-Headers come from its known_good.json'
        required: true
        default: '14.3.0'
  push:
    tags: ['glslang-*']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.ver.outputs.lib_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"; V="${V#glslang-}"
          else
            V="${{ inputs.lib_version }}"
          fi
          echo "lib_version=$V" >> $GITHUB_OUTPUT
          echo "release_tag=glslang-$V" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   platform: win64 }
          - { os: ubuntu-24.04,     platform: linuxsteamrt64 }
          - { os: ubuntu-24.04-arm, platform: linuxsteamrtarm64 }
          - { os: macos-26,         platform: osxarm64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-msvc
        if: runner.os == 'Windows'

      - name: Install cmake + ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone glslang ${{ needs.setup.outputs.lib_version }}
        run: git clone --depth 1 --branch ${{ needs.setup.outputs.lib_version }} https://github.com/KhronosGroup/glslang src

      - name: Fetch known-good SPIRV-Tools / SPIRV-Headers
        working-directory: src
        run: python update_glslang_sources.py

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_OPT=ON \
            -DENABLE_GLSLANG_BINARIES=OFF \
            -DGLSLANG_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_SKIP_EXECUTABLES=ON
          cmake --build src/build --parallel
          cmake --install src/build

      # Static CRT (/MT) to match Source 2's RuntimeLibrary=MultiThreaded.
      #
      # Built with the runner's current MSVC. Its STL emits calls to vectorised algorithm
      # helpers (__std_max_element_4u and friends) that only exist from the toolset which
      # introduced them, so linking these artifacts needs a local MSVC at least as new as
      # the runner's - currently 14.51 / VS 2026.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S src -B src\build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\dist" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DBUILD_SHARED_LIBS=OFF `
            -DENABLE_OPT=ON `
            -DENABLE_GLSLANG_BINARIES=OFF `
            -DGLSLANG_TESTS=OFF `
            -DBUILD_TESTING=OFF `
            -DSPIRV_SKIP_TESTS=ON `
            -DSPIRV_SKIP_EXECUTABLES=ON
          cmake --build src\build --parallel
          cmake --install src\build

      # Source 2 includes <SPIRV/doc.h> and <SPIRV/SPVRemapper.h>. glslang installs only its
      # public headers, so doc.h is missing from the install tree - take the whole SPIRV
      # directory from the source checkout, then let the installed copies win where both
      # exist.
      - name: Mirror SPIRV headers (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/include/SPIRV
          cp -r src/SPIRV/*.h dist/include/SPIRV/
          if [ -d dist/include/glslang/SPIRV ]; then
            cp -r dist/include/glslang/SPIRV/. dist/include/SPIRV/
          fi
          test -f dist/include/SPIRV/doc.h

      - name: Mirror SPIRV headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\include\SPIRV | Out-Null
          Copy-Item -Force src\SPIRV\*.h dist\include\SPIRV\
          if (Test-Path dist\include\glslang\SPIRV) {
            Copy-Item -Recurse -Force dist\include\glslang\SPIRV\* dist\include\SPIRV\
          }
          if (-not (Test-Path dist\include\SPIRV\doc.h)) { throw "SPIRV/doc.h missing from staged headers" }

      - uses: ./.github/actions/collect-package-upload
        with:
          lib_name: glslang
          lib_version: ${{ needs.setup.outputs.lib_version }}
          platform: ${{ matrix.platform }}

  release:
    needs: [setup, build]
    uses: ./.github/workflows/_release.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
      display_name: "glslang ${{ needs.setup.outputs.lib_version }}"
